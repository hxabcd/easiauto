[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "ruff>=0.15.5",
]

[project]
name = "EasiAuto"
version = "1.2.2b6"
description = "一款自动登录希沃白板的小工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0.3",
    "keyring>=25.7.0",
    "lief==0.17.6",
    "loguru>=0.7.3",
    "packaging>=25.0",
    "pillow>=12.0.0",
    "psutil>=7.1.3",
    "pyautogui>=0.9.54",
    "pydantic>=2.12.5",
    "pyside6>=6.9.3",
    "pyside6-fluent-widgets>=1.11.1",
    "pywin32>=311",
    "pywinauto>=0.6.9",
    "qt-pydantic>=0.1.1",
    "requests>=2.32.5",
    "sentry-sdk>=2.49.0",
    "windows11toast>=1.2.6",
]

[project.scripts]
dist-center = "tools.distribution_center:main"

[tool.hatch.build.targets.wheel]
packages = ["src/EasiAuto", "tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pyright]
autoImportCompletions = true
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[[tool.pyright.executionEnvironments]]
"extraPaths" = ["./vendors", "./resources"]
"pythonPlatform" = "Windows"
"pythonVersion" = "3.12"
"root" = "."

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]
exclude = ["**/.venv", "**/__pycache__", "build", "**/node_modules", "**/.*"]

[tool.ruff.lint]
select = [
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "ERA",  # eradicate
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "T201", # flake8-print
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    # "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "ARG002",
    "ERA001",
    "N801",
    "N802",
    "N815",
    "N999",
    "PLC0415",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "W293",
    "W291",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["EasiAuto"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "qt",
    "first-party",
    "local-folder",
]
sections = { "qt" = ["PySide6", "qfluentwidgets"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
